[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruka_py"
version = "0.1.0"
description = "High-level Python library for controlling the RUKA arm with MoveIt 2"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "VB-Industrial"}]
maintainers = [{name = "VB-Industrial"}]
keywords = ["ros2", "moveit2", "robotics", "motion-planning", "ruka"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=7",
    "ruff>=0.9",
]

[project.scripts]
ruka-collisions = "ruka_py.cli:main"

[project.urls]
Homepage = "https://github.com/VB-Industrial/ruka_py"
Documentation = "https://github.com/VB-Industrial/ruka_py/blob/main/docs/usage_ru.md"
Issues = "https://github.com/VB-Industrial/ruka_py/issues"
Repository = "https://github.com/VB-Industrial/ruka_py.git"

[tool.setuptools.packages.find]
include = ["ruka_py*"]

[tool.setuptools.package-data]
ruka_py = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
